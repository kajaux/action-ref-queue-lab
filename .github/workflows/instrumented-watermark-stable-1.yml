name: instrumented-watermark-stable-1
run-name: ${{ inputs.attempt }}
on:
  workflow_dispatch:
    inputs:
      attempt:
        type: string
        required: true
      experiment:
        type: string
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: commitish-instrumented-arm64
    timeout-minutes: 8
    steps:
      - name: Report started directly to collector
        env:
          COMMITISH_EXPERIMENT: ${{ inputs.experiment }}
          COMMITISH_CASE: instrumented-watermark-stable-1
          COMMITISH_PHASE: started
          COMMITISH_STATUS: ${{ job.status }}
          COMMITISH_MARKER: ''
        run: |
          /home/runner/externals/node24/bin/node --input-type=commonjs <<'COMMITISH_NODE'
          (async function reportJob(env, fetcher = fetch) {
            const endpoint = 'https://commitish.kjanat.dev';
            const experiment = env.COMMITISH_EXPERIMENT ?? '';
            if (!/^[a-f0-9-]{36}$/.test(experiment)) throw new Error('Invalid experiment ID');
            const requestURL = new URL(env.ACTIONS_ID_TOKEN_REQUEST_URL ?? '');
            if (requestURL.protocol !== 'https:') throw new Error('OIDC request must use HTTPS');
            requestURL.searchParams.set('audience', endpoint);
            const identityResponse = await fetcher(requestURL, {
              headers: {
                authorization: `Bearer ${env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`
              },
              redirect: 'error',
              signal: AbortSignal.timeout(10_000)
            });
            if (!identityResponse.ok) throw new Error(`GitHub OIDC request failed: HTTP ${identityResponse.status}`);
            const { value: token } = await identityResponse.json();
            if (typeof token !== 'string') throw new Error('GitHub returned no OIDC token');
            // Unverified decoding only supplies event fields; the server verifies the signed identity.
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const phase = env.COMMITISH_PHASE;
            const marker = env.COMMITISH_MARKER;
            if (![
              'started',
              'completed'
            ].includes(phase ?? '')) throw new Error('Invalid reporting phase');
            if (marker && !/^[ABC]$/.test(marker)) throw new Error('Invalid observed marker');
            const event = {
              version: 1,
              id: crypto.randomUUID(),
              producer: `github.${claims.run_id}.${claims.run_attempt}.${claims.check_run_id}`,
              sequence: phase === 'started' ? 0 : 1,
              caseId: env.COMMITISH_CASE,
              attempt: `${claims.run_id}:${claims.run_attempt}`,
              kind: `job.${phase}`,
              observedAt: new Date().toISOString(),
              data: {
                marker: marker ?? null,
                status: env.COMMITISH_STATUS ?? null
              }
            };
            // Keep the same event identity on transient errors/lost acknowledgements.
            for(let attempt = 0; attempt < 12; attempt++){
              let status = 0;
              try {
                const response = await fetcher(`${endpoint}/v1/experiments/${experiment}/events`, {
                  method: 'POST',
                  headers: {
                    authorization: `Bearer ${token}`,
                    'content-type': 'application/json'
                  },
                  body: JSON.stringify(event),
                  redirect: 'error',
                  signal: AbortSignal.timeout(10_000)
                });
                status = response.status;
                if (response.ok) {
                  const receipt = await response.json();
                  if (receipt.id !== event.id) throw new Error('Collector receipt mismatch');
                  console.log(`Collector acknowledged ${event.kind} for ${event.caseId}`);
                  return;
                }
                await response.body?.cancel();
              } catch (error) {
                if (status !== 0) throw error;
              }
              // 403 briefly occurs while the controller registers the freshly dispatched run.
              if (![
                0,
                403,
                429,
                500,
                502,
                503,
                504
              ].includes(status)) {
                throw new Error(`Collector rejected job event: HTTP ${status}`);
              }
              if (attempt === 11) throw new Error(`Collector unavailable or grant missing: HTTP ${status}`);
              await new Promise((resolve)=>setTimeout(resolve, 2000));
            }
          })(process.env).catch(() => { console.error('Direct collector reporting failed'); process.exitCode = 1; });
          COMMITISH_NODE
      - name: Prime action content
        id: prime
        uses: kajaux/action-ref-fixtures-copy@integrity-p4-instrumented-stable-1
      - name: Install late composite
        env:
          ACTION_DEFINITION_BASE64: 
          ACTION_PATH: .commitish-late/instrumented-watermark-stable-1
        run: |
          mkdir -p "$ACTION_PATH"
          printf '%s' "$ACTION_DEFINITION_BASE64" | base64 --decode > "$ACTION_PATH/action.yml"
      - name: Wait for controlled ref mutation
        env:
          GATE_REF: refs/heads/integrity-p4-instrumented-gate-stable-1
          GATE_TARGET: a414cf48b1b1df9060aa223f5042f9c67e122f6a
          SOURCE_URL: https://github.com/kajaux/action-ref-fixtures-copy.git
        run: |
          deadline=$((SECONDS + 300))
          while :; do
            observed="$(git ls-remote --refs "$SOURCE_URL" "$GATE_REF" | cut -f1)"
            if [ "$observed" = "$GATE_TARGET" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf '%s\n' 'Controlled gate timed out' >&2
              exit 1
            fi
            sleep 1
          done
      - name: Run late composite
        id: late
        uses: ./.commitish-late/instrumented-watermark-stable-1
      - name: Preserve opaque action outputs
        env:
          FIRST_CONTENT: ${{ steps.prime.outputs.marker }}
          SECOND_CONTENT: ${{ steps.late.outputs.marker }}
        run: |
          printf 'COMMITISH_FIRST_CONTENT=%s\n' "$FIRST_CONTENT"
          printf 'COMMITISH_SECOND_CONTENT=%s\n' "$SECOND_CONTENT"
      - name: Record collector liveness marker
        run: printf '%s\n' 'COMMITISH_MARKER=C'
      - name: Report completed directly to collector
        if: ${{ always() }}
        env:
          COMMITISH_EXPERIMENT: ${{ inputs.experiment }}
          COMMITISH_CASE: instrumented-watermark-stable-1
          COMMITISH_PHASE: completed
          COMMITISH_STATUS: ${{ job.status }}
          COMMITISH_MARKER: C
        run: |
          /home/runner/externals/node24/bin/node --input-type=commonjs <<'COMMITISH_NODE'
          (async function reportJob(env, fetcher = fetch) {
            const endpoint = 'https://commitish.kjanat.dev';
            const experiment = env.COMMITISH_EXPERIMENT ?? '';
            if (!/^[a-f0-9-]{36}$/.test(experiment)) throw new Error('Invalid experiment ID');
            const requestURL = new URL(env.ACTIONS_ID_TOKEN_REQUEST_URL ?? '');
            if (requestURL.protocol !== 'https:') throw new Error('OIDC request must use HTTPS');
            requestURL.searchParams.set('audience', endpoint);
            const identityResponse = await fetcher(requestURL, {
              headers: {
                authorization: `Bearer ${env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`
              },
              redirect: 'error',
              signal: AbortSignal.timeout(10_000)
            });
            if (!identityResponse.ok) throw new Error(`GitHub OIDC request failed: HTTP ${identityResponse.status}`);
            const { value: token } = await identityResponse.json();
